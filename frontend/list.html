<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSwap - Mes annonces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .modern-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 1.5rem;
        }
        .product-thumb {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .table th {
            white-space: nowrap;
            background-color: #f8f9fa;
        }
        .table td {
            vertical-align: middle;
        }
        .badge {
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div id="alert-container"></div>

    <div class="card modern-card">
        <div class="card-header-custom d-flex justify-content-between align-items-center">
            <div>
                <h3 class="mb-1 fw-bold">
                    <i class="fa-solid fa-list me-2"></i> Mes annonces
                </h3>
                <p class="mb-0 small text-white-50">TechSwap Morocco - Gestion des annonces</p>
            </div>
            <a href="add.html" class="btn btn-light rounded-pill px-4 fw-semibold shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> Ajouter une annonce
            </a>
        </div>

        <div class="card-body p-4">
            <!-- Loading indicator -->
            <div id="loading-state" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
                <p class="text-muted mt-2">Chargement des annonces...</p>
            </div>

            <!-- Empty state -->
            <div id="empty-state" class="text-center py-5 d-none">
                <i class="fa-solid fa-box-open fa-3x text-secondary mb-3"></i>
                <h5>Aucune annonce disponible</h5>
                <p class="text-muted">Vous n'avez pas encore publié d'annonce.</p>
                <a href="add.html" class="btn btn-primary rounded-pill px-4">
                    <i class="fa-solid fa-plus me-1"></i> Ajouter une première annonce
                </a>
            </div>

            <!-- Table -->
            <div id="table-container" class="table-responsive d-none">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Photo</th>
                            <th>Titre</th>
                            <th>Catégorie</th>
                            <th>Ville</th>
                            <th>Prix</th>
                            <th>État</th>
                            <th>Statut</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="annonces-table-body">
                        <!-- Populated by annonces.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/annonces.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        initListPage();
    });
</script>
</body>
</html>

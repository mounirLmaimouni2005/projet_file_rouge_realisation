<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSwap - Publier une annonce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .modern-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 1.5rem;
        }
        .form-label {
            font-weight: 600;
            color: #343a40;
            font-size: 0.9rem;
        }
        .form-control, .form-select {
            border-radius: 0.5rem;
            padding: 0.65rem 0.90rem;
            border-color: #dee2e6;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .preview-img {
            max-width: 150px;
            max-height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div id="alert-container"></div>

            <div class="card modern-card">
                <div class="card-header-custom d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="mb-0 fw-bold"><i class="fa-solid fa-plus-circle me-2"></i>Publier une annonce</h3>
                        <p class="mb-0 text-white-50 small">TechSwap Morocco - Espace Vendeur</p>
                    </div>
                    <a href="list.html" class="btn btn-light btn-sm rounded-pill px-3 fw-semibold">
                        <i class="fa-solid fa-arrow-left me-1"></i>Retour
                    </a>
                </div>
                
                <div class="card-body p-4 p-md-5 bg-white">
                    <form id="add-annonce-form">
                        
                        <div class="mb-3">
                            <label for="titre" class="form-label">Titre de l'annonce *</label>
                            <input type="text" name="titre" id="titre" class="form-control" placeholder="Ex: iPhone 14 Pro Max 256GB" minlength="5" maxlength="150" required>
                            <div class="form-text">Entre 5 et 150 caractères.</div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_categorie" class="form-label">Catégorie *</label>
                                <select name="id_categorie" id="id_categorie" class="form-select" required>
                                    <option value="">-- Chargement des catégories... --</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="id_ville" class="form-label">Ville *</label>
                                <select name="id_ville" id="id_ville" class="form-select" required>
                                    <option value="">-- Chargement des villes... --</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="prix" class="form-label">Prix (MAD) *</label>
                                <div class="input-group">
                                    <input type="number" name="prix" id="prix" class="form-control" step="0.01" min="0" placeholder="0.00" required>
                                    <span class="input-group-text">MAD</span>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="etat" class="form-label">État du produit *</label>
                                <select name="etat" id="etat" class="form-select" required>
                                    <option value="like_new">Comme neuf</option>
                                    <option value="good" selected>Bon état</option>
                                    <option value="fair">État moyen</option>
                                    <option value="needs_repair">À réparer</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description détaillée *</label>
                            <textarea name="description" id="description" class="form-control" rows="4" placeholder="Précisez les caractéristiques, l'état, les accessoires inclus..." minlength="10" required></textarea>
                            <div class="form-text">Minimum 10 caractères.</div>
                        </div>

                        <div class="mb-4">
                            <label for="photo" class="form-label">Photo du produit *</label>
                            <input type="file" name="photo" id="photo" class="form-control" accept="image/jpeg,image/png,image/webp" required>
                            <div class="form-text">Formats acceptés : JPG, PNG, WEBP (max 5 Mo).</div>
                            <div class="mt-3">
                                <img id="photo-preview" src="" alt="Aperçu de la photo" class="preview-img d-none">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="list.html" class="btn btn-outline-secondary rounded-pill px-4">
                                <i class="fa-solid fa-arrow-left me-1"></i> Annuler
                            </a>
                            <button type="submit" id="submit-btn" class="btn btn-primary rounded-pill px-5 fw-semibold shadow-sm">
                                <i class="fa-solid fa-check me-1"></i> Publier
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/annonces.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        initAddPage();
    });
</script>
</body>
</html>
